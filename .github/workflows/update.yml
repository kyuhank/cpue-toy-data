name: New data to report
run-name: "New synthetic data · ${{ github.sha }}"

on:
  push:
    branches: [main]
    paths: ['data/**', 'config/**', '.github/workflows/update.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pipeline:
    name: Pipeline
    uses: kyuhank/cpue-actions-demo/.github/workflows/toy-pipeline.yml@f0d79a0f45e15eb9ee922c7ff4f8341afe5dc230
    with:
      data_repository: ${{ github.repository }}
      data_ref: ${{ github.sha }}
      analysis_ref: f0d79a0f45e15eb9ee922c7ff4f8341afe5dc230

