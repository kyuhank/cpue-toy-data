name: New data to report
run-name: "${{ inputs.data_version && format('Database version {0}', inputs.data_version) || format('Synthetic update · {0}', github.sha) }}"

on:
  push:
    branches: [main]
    paths: ['data/**', 'config/**', '.github/workflows/update.yml']
  workflow_dispatch:
    inputs:
      data_version:
        description: 'Published Supabase snapshot version (blank uses the configured data source)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  pipeline:
    name: Pipeline
    uses: kyuhank/cpue-actions-demo/.github/workflows/toy-pipeline.yml@8279f20ef1ca5fca2abf11dfd6090f15fc5888be
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    with:
      data_version: ${{ inputs.data_version }}
      data_repository: ${{ github.repository }}
      data_ref: ${{ github.sha }}
      analysis_ref: 8279f20ef1ca5fca2abf11dfd6090f15fc5888be

