name: New data to report
run-name: "New synthetic data · ${{ github.sha }}"

on:
  push:
    branches: [main]
    paths: ['data/**', '.github/workflows/update.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: kyuhank/cpue-actions-demo/.github/workflows/toy-pipeline.yml@65904d6b28f405f7abd21b23ac03e8adfd27d284
    with:
      data_repository: ${{ github.repository }}
      data_ref: ${{ github.sha }}
      analysis_ref: 65904d6b28f405f7abd21b23ac03e8adfd27d284

