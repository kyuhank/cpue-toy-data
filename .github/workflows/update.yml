name: New data to report
run-name: "New synthetic data · ${{ github.sha }}"

on:
  push:
    branches: [main]
    paths: ['data/**', '.github/workflows/update.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: kyuhank/cpue-actions-demo/.github/workflows/toy-pipeline.yml@b2cb43f328803089ffad45dbcfec0c8d7e621611
    with:
      data_repository: ${{ github.repository }}
      data_ref: ${{ github.sha }}
      analysis_ref: b2cb43f328803089ffad45dbcfec0c8d7e621611

