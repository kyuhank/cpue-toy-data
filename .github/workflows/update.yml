name: New data to report
run-name: "${{ inputs.data_version && format('Database version {0}', inputs.data_version) || format('Synthetic update · {0}', github.sha) }}"

on:
  push:
    branches: [main]
    paths: ['data/**', 'config/**', '.github/workflows/update.yml']
  workflow_dispatch:
    inputs:
      intake_mode:
        description: 'Fixed synthetic intake: none, valid, invalid'
        required: false
        default: none
        type: string
      request_id:
        description: 'Reserved workshop request'
        required: false
        type: string
      data_version:
        description: 'Published Supabase snapshot version (blank uses the configured data source)'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  pipeline:
    name: Pipeline
    uses: kyuhank/cpue-actions-demo/.github/workflows/toy-pipeline.yml@e194cee7789809d8d14ef6578594463333564439
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    with:
      data_version: ${{ inputs.data_version }}
      intake_mode: ${{ inputs.intake_mode || 'none' }}
      request_id: ${{ inputs.request_id }}
      data_repository: ${{ github.repository }}
      data_ref: ${{ github.sha }}
      analysis_ref: e194cee7789809d8d14ef6578594463333564439

