name: New data to report
run-name: "${{ inputs.data_version && format('Database version {0}', inputs.data_version) || format('Synthetic update · {0}', github.sha) }}"

on:
  push:
    branches: [main]
    paths: ['data/**', 'config/**', '.github/workflows/update.yml']
  workflow_dispatch:
    inputs:
      data_version:
        description: 'Published Supabase snapshot version (blank uses the configured data source)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  pipeline:
    name: Pipeline
    uses: kyuhank/cpue-actions-demo/.github/workflows/toy-pipeline.yml@c77e5fd20cd9be63d1a9be28dc23d1b7efaaf4fa
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    with:
      data_version: ${{ inputs.data_version }}
      data_repository: ${{ github.repository }}
      data_ref: ${{ github.sha }}
      analysis_ref: c77e5fd20cd9be63d1a9be28dc23d1b7efaaf4fa

