name: New data to report
run-name: "New synthetic data · ${{ github.sha }}"

on:
  push:
    branches: [main]
    paths: ['data/**', '.github/workflows/update.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: kyuhank/cpue-actions-demo/.github/workflows/toy-pipeline.yml@fe5c5363aa5d5971c7af01a9874ecb54f284fcaa
    with:
      data_repository: ${{ github.repository }}
      data_ref: ${{ github.sha }}
      analysis_ref: fe5c5363aa5d5971c7af01a9874ecb54f284fcaa

