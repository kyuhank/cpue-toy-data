name: New data to report
run-name: "${{ inputs.source_commit && format('Workshop · {0}', inputs.source_commit) || format('Synthetic update · {0}', github.sha) }}"

on:
  push:
    branches: [main]
    paths: ['data/**', 'config/**', '.github/workflows/update.yml']
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Exact saved data and module configuration commit'
        required: false
        type: string
      intake_mode:
        description: 'Fixed synthetic intake: none, valid, invalid'
        required: false
        default: none
        type: string
      request_id:
        description: 'Reserved workshop request'
        required: false
        type: string
      data_version:
        description: 'Published Supabase snapshot version (blank uses the configured data source)'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  pipeline:
    name: Pipeline
    uses: kyuhank/cpue-actions-demo/.github/workflows/toy-pipeline.yml@da1b480443869bd19b878b0addc359be89abc4cb
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    with:
      data_version: ${{ inputs.data_version }}
      intake_mode: ${{ inputs.intake_mode || 'none' }}
      request_id: ${{ inputs.request_id }}
      data_repository: ${{ github.repository }}
      data_ref: ${{ inputs.source_commit || github.sha }}
      analysis_ref: da1b480443869bd19b878b0addc359be89abc4cb
