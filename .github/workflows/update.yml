name: New data to report
run-name: "New synthetic data · ${{ github.sha }}"

on:
  push:
    branches: [main]
    paths: ['data/**', '.github/workflows/update.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: kyuhank/cpue-actions-demo/.github/workflows/toy-pipeline.yml@3cc909fc8ec29a33db72d2ea964cddffbd89b66d
    with:
      data_repository: ${{ github.repository }}
      data_ref: ${{ github.sha }}
      analysis_ref: 3cc909fc8ec29a33db72d2ea964cddffbd89b66d

