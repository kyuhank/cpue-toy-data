name: New data to report
run-name: "New synthetic data · ${{ github.sha }}"

on:
  push:
    branches: [main]
    paths: ['data/**', '.github/workflows/update.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: kyuhank/cpue-actions-demo/.github/workflows/toy-pipeline.yml@b1821674b14222c26e1169b39f98cdd1a42f3700
    with:
      data_repository: ${{ github.repository }}
      data_ref: ${{ github.sha }}
      analysis_ref: b1821674b14222c26e1169b39f98cdd1a42f3700

